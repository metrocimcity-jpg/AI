[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siteguard-vision"
version = "0.1.0"
description = "Offline construction-site safety dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "opencv-python-headless>=4.10,<5",
  "onnxruntime>=1.20",
  "numpy>=2.1",
  "python-multipart>=0.0.12",
  "pyjwt>=2.9",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
ignore_missing_imports = true
